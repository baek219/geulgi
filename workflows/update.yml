# 자동 심부름 로봇: 정해진 시간마다 collect.py를 실행해서 data.json을 새로 고칩니다.
name: 자료 자동 갱신

on:
  schedule:
    - cron: "17 0 * * *"    # 매일 오전 9시 17분 (한국 시간)
    - cron: "47 12 * * 6"   # 매주 토요일 밤 9시 47분 (로또 추첨 직후)
  workflow_dispatch:         # GitHub 화면에서 "Run workflow" 버튼으로 바로 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 동행복권 자료 가져오기
        run: python collect.py
      - name: 바뀐 내용이 있으면 저장하기
        run: |
          git config user.name "auto-update"
          git config user.email "auto-update@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "자료 자동 갱신"
          git push
