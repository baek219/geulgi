   name: 자료 자동 갱신

   on:
     schedule:
       - cron: "17 0 * * *"
       - cron: "47 12 * * 6"
     workflow_dispatch:

   permissions:
     contents: write

   jobs:
     update:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-python@v5
           with:
             python-version: "3.12"
         - name: 동행복권 자료 가져오기
           run: python collect.py
         - name: 바뀐 내용이 있으면 저장하기
           run: |
             git config user.name "auto-update"
             git config user.email "auto-update@users.noreply.github.com"
             git add data.json
             git diff --cached --quiet || git commit -m "자료 자동 갱신"
             git push
